↓link_composant [transactions.SqlTransaction]: 
  comment: Associe un composant a une machine (ecran FEN_Machine, bouton Ajouter).
  sqlQuery: UPDATE composants SET machine_id = {machine_id} WHERE id = {id}
  ↓id [variables.RequestableVariable-1789128172727]: 
    comment: composant primary key.
  ↓machine_id [variables.RequestableVariable-1789128172729]: 
    comment: Machine to attach the composant to.
↓list_composants [transactions.SqlTransaction]: 
  comment: List Composants rows.
  sqlQuery: |
    SELECT base.id, base.n_serie, base.date_achat, base.garantie, base.num_retour, base.date_retour, base.date_renvoi, base.commentaire, base.machine_id, base.modele_id, base.fournisseur_id, rel_1.nom AS fournisseur_id__label, rel_2.nom_machine AS machine_id__label, rel_3.nom_modele AS modele_id__label
    FROM composants base
    LEFT JOIN fournisseurs rel_1 ON base.fournisseur_id = rel_1.id
    LEFT JOIN machines rel_2 ON base.machine_id = rel_2.id
    LEFT JOIN modeles rel_3 ON base.modele_id = rel_3.id
    ORDER BY base.id ASC
↓list_composants_by_fournisseur [transactions.SqlTransaction]: 
  comment: List Composants rows filtered by fournisseur_id.
  sqlQuery: |
    SELECT base.id, base.n_serie, base.date_achat, base.garantie, base.num_retour, base.date_retour, base.date_renvoi, base.commentaire, base.machine_id, base.modele_id, base.fournisseur_id, rel_1.nom AS fournisseur_id__label, rel_2.nom_machine AS machine_id__label, rel_3.nom_modele AS modele_id__label
    FROM composants base
    LEFT JOIN fournisseurs rel_1 ON base.fournisseur_id = rel_1.id
    LEFT JOIN machines rel_2 ON base.machine_id = rel_2.id
    LEFT JOIN modeles rel_3 ON base.modele_id = rel_3.id
    WHERE base.fournisseur_id = {fournisseur_id}
    ORDER BY base.id ASC
  ↓fournisseur_id [variables.RequestableVariable-1789123180048]: 
    comment: FournisseurId foreign key referencing fournisseurs.id.
    description: FournisseurId foreign key referencing fournisseurs.id.
