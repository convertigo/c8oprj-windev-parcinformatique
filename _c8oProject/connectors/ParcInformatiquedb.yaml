↓init_schema [transactions.SqlTransaction]: 
  comment: Create or update the SQL schema for Lieux, Utilisateurs, Fournisseurs, Modèles, Machines, Composants and seed demo rows.
  sqlQuery: |
    CREATE TABLE IF NOT EXISTS emplacements (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      nom VARCHAR(40) NOT NULL UNIQUE,
      commentaire LONGVARCHAR,
      rectangle VARCHAR(19),
      picto VARCHAR(255)
    );
    
    CREATE TABLE IF NOT EXISTS utilisateurs (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      initiales VARCHAR(10) NOT NULL UNIQUE,
      civilite INT,
      nom_complet VARCHAR(30),
      tel VARCHAR(20),
      photo VARCHAR(255)
    );
    
    CREATE TABLE IF NOT EXISTS fournisseurs (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      nom VARCHAR(40) NOT NULL UNIQUE,
      adresse VARCHAR(300),
      tel VARCHAR(20),
      tel_sav VARCHAR(20),
      fax VARCHAR(20)
    );
    
    CREATE TABLE IF NOT EXISTS modeles (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      type_modele VARCHAR(30) NOT NULL,
      nom_modele VARCHAR(30) NOT NULL,
      marque VARCHAR(30),
      caracteristique1 VARCHAR(30),
      valeur1 VARCHAR(50),
      caracteristique2 VARCHAR(30),
      valeur2 VARCHAR(50),
      caracteristique3 VARCHAR(30),
      valeur3 VARCHAR(50),
      caracteristique4 VARCHAR(30),
      valeur4 VARCHAR(50),
      commentaire LONGVARCHAR
    );
    
    CREATE TABLE IF NOT EXISTS machines (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      nom_machine VARCHAR(40) NOT NULL UNIQUE,
      adresse_ip VARCHAR(20),
      emplacement_id INT REFERENCES emplacements(id),
      utilisateur_id INT REFERENCES utilisateurs(id)
    );
    
    CREATE TABLE IF NOT EXISTS composants (
      id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      n_serie VARCHAR(20) NOT NULL,
      date_achat DATE,
      garantie VARCHAR(20),
      num_retour VARCHAR(20),
      date_retour DATE,
      date_renvoi DATE,
      commentaire LONGVARCHAR,
      machine_id INT REFERENCES machines(id),
      modele_id INT NOT NULL REFERENCES modeles(id),
      fournisseur_id INT REFERENCES fournisseurs(id)
    );
    
    DELETE FROM composants;
    
    DELETE FROM machines;
    
    DELETE FROM modeles;
    
    DELETE FROM fournisseurs;
    
    DELETE FROM utilisateurs;
    
    DELETE FROM emplacements;
    
