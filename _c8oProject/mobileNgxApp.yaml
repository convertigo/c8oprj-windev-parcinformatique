            --parc-surface: #ffffff;
            --parc-surface-2: #f4f7fd;
            --parc-bg: #eef3fb;
            --parc-border: #d5e0f2;
            --parc-shadow: 0 1px 2px rgba(15, 42, 111, 0.05), 0 8px 24px rgba(15, 42, 111, 0.08);
            --parc-shadow-lg: 0 12px 32px rgba(15, 42, 111, 0.18);
            --parc-header-gradient: linear-gradient(135deg, #0b2a6f 0%, #1d4ed8 62%, #0ea5e9 130%);
            --parc-plan-bg: #f4f8fe;
            --parc-plan-grid: rgba(29, 78, 216, 0.07);
            --parc-room-bg: linear-gradient(180deg, #ffffff 0%, #e6eefc 100%);
            --parc-room-bg-hover: linear-gradient(180deg, #ffffff 0%, #d6e4fb 100%);
            --parc-room-border: #9db4e4;
            --parc-room-ink: #0b2a6f;
          
            --ion-color-primary: #1d4ed8;
            --ion-color-primary-rgb: 29, 78, 216;
            --ion-color-primary-contrast: #ffffff;
            --ion-color-primary-contrast-rgb: 255, 255, 255;
            --ion-color-primary-shade: #1e40af;
            --ion-color-primary-tint: #3b82f6;
            --ion-color-secondary: #0284c7;
            --ion-color-secondary-rgb: 2, 132, 199;
            --ion-color-secondary-contrast: #ffffff;
            --ion-color-secondary-contrast-rgb: 255, 255, 255;
            --ion-color-secondary-shade: #0369a1;
            --ion-color-secondary-tint: #0ea5e9;
            --ion-color-tertiary: #4f46e5;
            --ion-color-tertiary-rgb: 79, 70, 229;
            --ion-color-tertiary-contrast: #ffffff;
            --ion-color-tertiary-contrast-rgb: 255, 255, 255;
            --ion-color-tertiary-shade: #4338ca;
