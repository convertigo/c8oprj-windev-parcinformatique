↓PrintStyle [ngx.components.UIStyle-1789132824445]: 
  comment: 'Impression des etats (equivalent des apercus WinDev) : masque le menu et les barres, libere le defilement du contenu.'
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '/* Impression des etats ParcInformatique */
          @media print {
            ion-menu, ion-header, ion-toolbar, ion-footer, .no-print { display: none !important; }
            ion-app, ion-router-outlet, ion-split-pane, .ion-page, ion-content { position: static !important; contain: none !important; overflow: visible !important; display: block !important; height: auto !important; }
            ion-content { --overflow: visible; }
            ion-content::part(scroll) { position: static !important; overflow: visible !important; contain: none !important; }
            ion-card { box-shadow: none !important; border: 1px solid #ccc; break-inside: avoid; }
            body { background: #fff !important; }
          }
          .parc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
          .parc-table th, .parc-table td { border: 1px solid #c8c8c8; padding: 4px 6px; text-align: left; vertical-align: top; }
          .parc-table th { background: #e9eef5; font-weight: 600; }
          .parc-table tbody tr { cursor: pointer; }
          .parc-table tbody tr:hover { background: #f3f7ff; }
          .parc-table tbody tr.selected { background: #dbe9ff; }
          .parc-total { font-weight: 600; margin: 8px 0 0 4px; }
          .parc-preview { display: flex; align-items: center; gap: 8px; margin: 2px 16px 10px; font-size: 13px; color: #444; }
          .parc-preview ion-icon { font-size: 22px; color: #5c6bc0; flex: 0 0 auto; }
          .parc-preview img { border-radius: 4px; }
          '
