            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
          }
          parcinformatique-crudpageheader ion-card-header { padding: 1.1rem 4rem 1.2rem 1.4rem; }
          parcinformatique-crudpageheader ion-card-header, parcinformatique-crudpageheader ion-card-header * { color: #ffffff; }
          parcinformatique-crudpageheader ion-card-header ion-card-title { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; }
          parcinformatique-crudpageheader ion-card-header ion-card-subtitle { font-size: 0.9rem; font-weight: 500; text-transform: none; letter-spacing: 0; opacity: 0.88; margin-top: 0.2rem; color: #ffffff; }
          parcinformatique-crudpageheader ion-menu-button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            --color: #ffffff;
            color: #ffffff;
            --background: rgba(255, 255, 255, 0.14);
            --background-hover: rgba(255, 255, 255, 0.26);
            --border-radius: 10px;
            --padding-start: 6px;
            --padding-end: 6px;
            font-size: 26px;
          }
          ion-col:has(> parcinformatique-crudpageheader) { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding-bottom: 12px; }
          ion-col:has(> parcinformatique-crudpageheader) > parcinformatique-crudpageheader { flex: 1 1 320px; min-width: 0; }
          ion-col:has(> parcinformatique-crudpageheader) > ion-button { flex: 0 0 auto; margin: 0; }
          
          /* 5) Cartes */
          ion-card {
            --background: var(--parc-surface);
            --color: var(--parc-ink);
            background: var(--parc-surface);
            color: var(--parc-ink);
            border: 1px solid var(--parc-border);
            border-radius: 14px;
            box-shadow: var(--parc-shadow);
            margin: 0 0 12px 0;
          }
          ion-card-header { padding: 1rem 1.1rem 0.35rem; }
          ion-card-header ion-card-title { color: var(--parc-navy); font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; }
          ion-card-header ion-card-subtitle { color: var(--parc-muted); font-size: 0.82rem; font-weight: 500; letter-spacing: 0; text-transform: none; margin-top: 0.15rem; }
          ion-card-content { padding: 0.75rem 1.1rem 1rem; color: var(--parc-ink); }
          ion-card-content p { color: var(--parc-ink); }
          parcinformatique-dashboardstatcard ion-card { border-top: 4px solid var(--parc-blue); }
          parcinformatique-dashboardstatcard ion-card-content { font-size: 1.5rem; font-weight: 800; color: var(--parc-navy); letter-spacing: -0.02em; }
          .parc-screen-card { border-left: 4px solid var(--parc-sky); }
          
          /* 6) Boutons */
          ion-button { --border-radius: 10px; --box-shadow: none; font-weight: 600; text-transform: none; letter-spacing: 0; min-height: 40px; margin: 4px 6px 4px 0; }
          ion-button::part(native) { padding: 0.45rem 0.95rem; }
          ion-button[fill=''outline''] { --border-color: var(--parc-blue-200); --color: var(--parc-blue); --background-hover: var(--parc-blue-50); --background-focused: var(--parc-blue-50); --background-activated: var(--parc-blue-100); }
          ion-button[fill=''clear''] { --color: var(--parc-blue); }
          ion-button[color=''danger''][fill=''outline''] { --border-color: rgba(220, 38, 38, 0.35); --color: #dc2626; }
          ion-button[size=''small''] { min-height: 32px; }
          
          /* 7) Barres d''outils des ecrans */
          .parc-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; padding: 0.5rem 0.75rem; margin: 0 0 12px; background: var(--parc-surface); border: 1px solid var(--parc-border); border-radius: 12px; box-shadow: var(--parc-shadow); }
          .parc-toolbar ion-button { margin: 0; min-height: 36px; }
          .parc-toolbar ion-button::part(native) { padding: 0.35rem 0.8rem; }
          .parc-toolbar .parc-filter, .parc-toolbar .parc-hint, .parc-toolbar .parc-total { margin: 0 0 0 auto; padding-left: 0.5rem; }
          .parc-toolbar ion-item, .parc-toolbar .parc-select { margin: 0; min-width: 220px; }
          
          /* 8) Listes */
          ion-list ion-item::part(native) { padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--parc-border); transition: background 0.15s ease; }
          ion-list ion-item.item-interactive:hover::part(native), ion-list ion-item[button]:hover::part(native) { background: var(--parc-blue-50) !important; }
          ion-list ion-item.selected::part(native), ion-list ion-item.machine-selected::part(native) { background: var(--parc-blue-100) !important; box-shadow: inset 3px 0 0 var(--parc-blue); }
          ion-list ion-item ion-label h2, ion-list ion-item ion-label h3 { margin: 0 0 0.1rem; color: var(--parc-ink); font-size: 0.95rem; font-weight: 650; }
          ion-list ion-item ion-label p { color: var(--parc-muted) !important; font-size: 0.82rem; }
          
          /* 9) Tables */
          .parc-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.86rem; color: var(--parc-ink); }
          .parc-table th, .parc-table td { border: 0; border-bottom: 1px solid var(--parc-border); padding: 0.5rem 0.65rem; text-align: left; vertical-align: top; }
          .parc-table thead th { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--parc-surface) 85%, var(--parc-blue) 15%); color: var(--parc-navy); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 2px solid var(--parc-blue-200); }
          .parc-table tbody tr { cursor: pointer; transition: background 0.12s ease; }
          .parc-table tbody tr:hover { background: var(--parc-blue-50); }
          .parc-table tbody tr.selected { background: var(--parc-blue-100); box-shadow: inset 3px 0 0 var(--parc-blue); }
          .parc-table tr.parc-group-row td { background: var(--parc-surface-2); color: var(--parc-navy); font-weight: 700; }
          .parc-table tr.parc-total-row td { font-weight: 700; border-top: 2px solid var(--parc-blue-200); }
          .parc-total { font-weight: 700; color: var(--parc-navy); margin: 8px 0 0 4px; }
          
          /* 10) Zones defilantes des listes sur ecran large : la liste defile, la fiche et le formulaire restent visibles */
          @media (min-width: 992px) {
            .parc-master ion-card-content, .parc-master .parc-scroll { max-height: calc(100vh - 300px); overflow: auto; }
          }
          
          /* 11) Plan des locaux (ParcPage, LieuxPage) : repere WinDev 709 x 538 rendu en pourcentages, ratio conserve */
          .parc-plan {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            aspect-ratio: 1.3178;
            height: auto;
            container-type: inline-size;
            background-color: var(--parc-plan-bg);
            background-image: linear-gradient(var(--parc-plan-grid) 1px, transparent 1px), linear-gradient(90deg, var(--parc-plan-grid) 1px, transparent 1px);
            background-size: 24px 24px;
            border: 1px solid var(--parc-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(15, 42, 111, 0.06);
          }
          .parc-plan.drawing { cursor: crosshair; }
          .parc-room {
            position: absolute;
            box-sizing: border-box;
            border: 1px solid var(--parc-room-border);
            border-radius: 5px;
            background: var(--parc-room-bg);
            color: var(--parc-room-ink);
            font-weight: 700;
            font-size: 11px;
            font-size: clamp(9px, 1.6cqw, 12px);
            line-height: 1.25;
            padding: 3px 5px;
            cursor: pointer;
            overflow: hidden;
            transition: background 0.15s ease, box-shadow 0.15s ease;
          }
          .parc-room:hover { background: var(--parc-room-bg-hover); box-shadow: 0 2px 8px rgba(29, 78, 216, 0.18); }
          .parc-room.selected { outline: 3px solid var(--parc-blue); outline-offset: 1px; z-index: 2; }
          .parc-room.highlight { box-shadow: inset 0 0 0 3px var(--parc-sky); }
          .parc-count { display: block; font-weight: 500; font-size: 0.9em; color: var(--parc-sky); margin-top: 2px; }
          .parc-newrect { position: absolute; box-sizing: border-box; border: 2px dashed var(--parc-blue); border-radius: 4px; background: rgba(29, 78, 216, 0.12); pointer-events: none; z-index: 3; }
          .parc-filter { font-weight: 600; color: var(--parc-muted); margin: 0; }
          .parc-hint { font-weight: 600; color: var(--parc-blue); margin: 0; }
          .parc-picto { max-width: 120px; max-height: 80px; display: block; margin-top: 6px; border-radius: 6px; }
          .machine-selected { --background: var(--parc-blue-100); }
          
          /* 12) Menu lateral et en-tetes */
          ion-menu { --width: 280px; }
          ion-header ion-toolbar { --background: var(--parc-header-gradient); --color: #ffffff; --border-width: 0; }
          ion-header { border-bottom: 0; box-shadow: 0 2px 10px rgba(11, 42, 111, 0.15); }
          ion-header ion-toolbar ion-title { color: #ffffff; font-weight: 700; }
          ion-menu ion-header ion-toolbar { --min-height: 60px; }
          ion-menu ion-header ion-toolbar ion-label { display: block; padding: 0 1rem; color: #ffffff; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.01em; }
          ion-menu ion-content, :root.force-light ion-menu ion-content { --background: var(--parc-surface); background: var(--parc-surface); }
          ion-menu ion-list { padding: 10px 0; }
          ion-menu.md ion-item, ion-menu.ios ion-item { --border-radius: 10px; border-radius: 10px; --padding-start: 12px; --padding-end: 12px; --min-height: 44px; margin: 2px 8px; --color: var(--parc-ink); font-weight: 500; }
          ion-menu ion-list ion-item::part(native) { border-bottom: 0; border-radius: 10px; padding: 0.55rem 0.75rem; }
          ion-menu ion-list ion-item:hover::part(native) { background: var(--parc-blue-50) !important; }
          ion-menu ion-list ion-item.selected::part(native) { background: var(--parc-blue-100) !important; }
          ion-menu.md ion-item ion-icon, ion-menu.ios ion-item ion-icon { color: var(--parc-muted); }
          ion-menu.md ion-item.selected, ion-menu.ios ion-item.selected { --background: transparent; --color: var(--parc-blue); font-weight: 700; }
          ion-menu.md ion-item.selected ion-icon, ion-menu.ios ion-item.selected ion-icon { color: var(--parc-blue); }
          
          /* 13) Champs de saisie */
          ion-item.item-has-focus { border-color: var(--parc-blue); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
          ion-item ion-label { color: var(--parc-muted); }
          
          /* 14) Divers */
          .parc-empty { margin: 0; color: var(--parc-muted); font-size: 0.9rem; line-height: 1.4; }
          .parc-preview { display: flex; align-items: center; gap: 8px; margin: 2px 4px 10px; font-size: 0.85rem; color: var(--parc-muted); }
          .parc-preview ion-icon { font-size: 22px; color: var(--parc-blue); flex: 0 0 auto; }
          .parc-preview img { border-radius: 6px; }
          ion-alert { --backdrop-opacity: 0.45; }
          ion-toast { --border-radius: 10px; }
          
          /* 15) Impression : bandeau, bouton menu et barres d''outils neutralises */
          @media print {
            parcinformatique-crudpageheader ion-card { background: #ffffff !important; box-shadow: none !important; }
            parcinformatique-crudpageheader ion-card-header * { color: #0b2a6f !important; }
            parcinformatique-crudpageheader ion-card::after { display: none; }
            parcinformatique-crudpageheader ion-menu-button { display: none !important; }
            .parc-toolbar { display: none !important; }
            .parc-master ion-card-content { max-height: none !important; overflow: visible !important; }
          }
