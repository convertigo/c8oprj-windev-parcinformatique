    styleContent: 
      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
        - com.twinsoft.convertigo.beans.common.FormatedContent: 
          →: |
            '.parc-report { background: #ffffff; color: #0f1f3d; border: 1px solid var(--parc-border, #d5e0f2); border-radius: 12px; padding: 1.25rem 1.5rem; box-shadow: var(--parc-shadow); }
            .parc-report h2 { font: 700 18px/1.3 var(--ion-font-family, sans-serif); color: #0b2a6f; margin: 12px 0 8px; padding-bottom: 6px; border-bottom: 2px solid #bfdbfe; }
            .parc-report h3 { font: 700 14px/1.3 var(--ion-font-family, sans-serif); color: #1d4ed8; margin: 14px 0 4px; }
            .parc-report .parc-table { width: 100%; border-collapse: collapse; font-size: 12px; color: #0f1f3d; }
            .parc-report .parc-table th, .parc-report .parc-table td { border: 1px solid #d5e0f2; padding: 4px 6px; text-align: left; vertical-align: top; position: static; }
            .parc-report .parc-table th { background: #eff6ff; color: #0b2a6f; text-transform: none; letter-spacing: 0; font-size: 12px; }
            .parc-report .parc-group-row td { background: #dbeafe; color: #0b2a6f; font-weight: 600; }
            .parc-report .parc-total-row td { font-weight: 700; background: #f4f7fd; border-top: 2px solid #bfdbfe; }
            .parc-total { font-weight: 700; color: #0b2a6f; margin: 6px 0 12px 4px; }
            .parc-select { max-width: 360px; }
